name: Verify Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify music services and native UI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & ./tools/test.ps1 -IncludeMedia 2>&1 | Tee-Object -FilePath artifacts/verification.log
          if($LASTEXITCODE -ne 0){throw 'Windows verification failed.'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-verification-log
          path: artifacts/verification.log
          if-no-files-found: ignore
