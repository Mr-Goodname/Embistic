name: Build Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $releaseTag=$env:GITHUB_REF_NAME
          if($env:GITHUB_REF_TYPE -ne 'tag' -or $releaseTag -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$'){
            throw 'Run this workflow on a vX.Y.Z release tag.'
          }
          $releaseVersion=$Matches[1]
          "version=$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify music services and native UI
        shell: pwsh
        run: |
          & ./tools/test.ps1 -IncludeMedia
          if($LASTEXITCODE -ne 0){throw 'Release verification failed.'}

      - name: Publish self-contained Windows x64 app
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish src/Embistic/Embistic.csproj -c Release -r win-x64 --self-contained true -p:Version="$env:RELEASE_VERSION" -p:DebugType=None -p:DebugSymbols=false -o dist/Embistic-win-x64
          if($LASTEXITCODE -ne 0){throw 'Windows publish failed.'}
          Copy-Item -LiteralPath README.md,THIRD_PARTY_NOTICES.md -Destination dist/Embistic-win-x64 -Force
          Copy-Item -LiteralPath licenses -Destination dist/Embistic-win-x64 -Recurse -Force
          Copy-Item -LiteralPath docs -Destination dist/Embistic-win-x64 -Recurse -Force
          $publishRoot=[IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'dist\Embistic-win-x64'))
          $x86=[IO.Path]::GetFullPath((Join-Path $publishRoot 'libvlc\win-x86'))
          if(!$x86.StartsWith($publishRoot+[IO.Path]::DirectorySeparatorChar,[StringComparison]::OrdinalIgnoreCase)){
            throw 'Invalid native output directory.'
          }
          if(Test-Path -LiteralPath $x86){Remove-Item -LiteralPath $x86 -Recurse -Force}
          Compress-Archive -Path dist/Embistic-win-x64 -DestinationPath dist/Embistic-win-x64.zip -CompressionLevel Optimal -Force

      - name: Compile installer with runner's Inno Setup
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          & ./tools/build-installer-local.ps1 -Version $env:RELEASE_VERSION
          if($LASTEXITCODE -ne 0){throw 'Installer build failed.'}

      - name: Write checksums
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $assets=@('dist/Embistic-win-x64.zip',("dist/Embistic-"+$env:RELEASE_VERSION+"-setup.exe"))
          $lines=foreach($asset in $assets){
            $hash=(Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($asset))"
          }
          [IO.File]::WriteAllLines((Join-Path $env:GITHUB_WORKSPACE 'dist\SHA256SUMS.txt'),$lines,[Text.UTF8Encoding]::new($false))

      - uses: actions/upload-artifact@v4
        with:
          name: Embistic-Windows-release
          path: |
            dist/Embistic-win-x64.zip
            dist/Embistic-*-setup.exe
            dist/SHA256SUMS.txt

      - name: Publish release assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $assets=@('dist/Embistic-win-x64.zip',("dist/Embistic-"+$env:RELEASE_VERSION+"-setup.exe"),'dist/SHA256SUMS.txt')
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" *> $null
          if($LASTEXITCODE -eq 0){
            gh release upload "$env:GITHUB_REF_NAME" @assets --repo "$env:GITHUB_REPOSITORY" --clobber
          }else{
            gh release create "$env:GITHUB_REF_NAME" @assets --repo "$env:GITHUB_REPOSITORY" --verify-tag --title "Embistic $env:RELEASE_VERSION" --generate-notes
          }
          if($LASTEXITCODE -ne 0){throw 'GitHub release publishing failed.'}
